[package]
name = "ais-chain"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "Discover workflow chains in Azure Logic Apps Standard projects"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"

# ── Debug build size ─────────────────────────────────────────────────────────
# Kept in step with the AIS apps that depend on this crate. Nothing here had
# grown — the whole dependency graph is 41 packages and there is no `rsx!` to
# expand — so this is for consistency rather than to fix a problem: line
# tables for our own code, no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
